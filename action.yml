---
# yamllint disable rule:line-length
name: Deploy Managed ECS Service or Task
description: Deploy Managed ECS Service or Scheduled Task
branding:
  icon: package
  color: orange
inputs:
  token:
    description: Deployment API token.
  client_id:
    description: Deployment API client id.
  client_secret:
    description: Deployment API client secret.
  url:
    description: Deployment API url.
    required: true
  service:
    description: The name of the ECS service to update. Either service or task is required.
  task:
    description: The name of the ECS scheduled task to update. Either service or task is required.
  image:
    description: The container image to use for the service or task.
    required: true
  force:
    description: Force deployment of same image.
  secret_arns:
    description: Comma-separated list of secret ARNs to attach to the service (services only).
  schedule_expression:
    description: Schedule expression for cron tasks (tasks only).
  detached:
    description: Detached deployment without waiting for result.
    default: "false"
  timeout:
    description: Timeout for connections to the API. Defaults to 10.
    default: "10"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - name: Install Packages
      uses: awalsh128/cache-apt-pkgs-action@v1.5.3
      with:
        packages: curl jq jo
    - name: Deploy Managed ECS Service or Task
      id: ecs-service-deployment
      run: ${GITHUB_ACTION_PATH}/deploy.sh
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TASK: ${{ inputs.task }}
        IMAGE: ${{ inputs.image }}
        FORCE: ${{ inputs.force }}
        SECRET_ARNS: ${{ inputs.secret_arns }}
        SCHEDULE_EXPRESSION: ${{ inputs.schedule_expression }}
        DETACHED: ${{ inputs.detached }}
        TOKEN: ${{ inputs.token }}
        URL: ${{ inputs.url }}
        CLIENT_ID: ${{ inputs.client_id }}
        CLIENT_SECRET: ${{ inputs.client_secret }}
        DEBUG: ${{ runner.debug }}
        TIMEOUT: ${{ inputs.timeout }}
